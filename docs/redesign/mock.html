<title>Madhurya Vastra Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Eczar:wght@500;600&family=Marcellus&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: review bench — screen list + device frame + "what changed" notes; the app inside the frame
   adapts with container queries, so phone / tablet / laptop are real layouts, not scaled pictures. */
:root{
  --primary:#6D37C0; --primary-hover:#5A2BA3; --primary-soft:#9E69E4; --on-primary:#FFFFFF;
  --tint:#F3ECFC; --tint-strong:#E7DAFA;
  --bg:#FBF9FE; --surface:#FFFFFF; --border:#E7DFF3;
  --text:#241A33; --muted:#6E6680;
  --zari:#B8923A; --zari-tint:#F6EEDC;
  --success:#2E7D5B; --success-tint:#E3F2EA; --danger:#C0392B; --danger-tint:#FBE7E4;
  --bench:#F1ECF8; --frame:#1E1729;
  --shadow:0 1px 2px rgb(36 26 51 / .06), 0 8px 24px rgb(36 26 51 / .08);
  --grad:linear-gradient(160deg,#9E69E4 0%,#6D37C0 70%);
  --hero:radial-gradient(120% 90% at 85% 0%,#C9A6F3 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#D9C4F6 0%,transparent 60%),#F1E9FB;
  --f-brand:"Cormorant Garamond",Georgia,serif;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-accent:"Eczar",Georgia,serif;
  --f-ui:"Mukta","Segoe UI",system-ui,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#B48CF0; --primary-hover:#C6A6F5; --primary-soft:#8752D4; --on-primary:#1A1225;
  --tint:#2A2140; --tint-strong:#352A52;
  --bg:#16111F; --surface:#211A2D; --border:#3A3150;
  --text:#EEE8F7; --muted:#A79FB8;
  --zari:#D4B062; --zari-tint:#3A3020;
  --success:#5FBF95; --success-tint:#1D3329; --danger:#E57368; --danger-tint:#3D2220;
  --bench:#0F0B16; --frame:#000000;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
  --grad:linear-gradient(160deg,#8752D4 0%,#4E2690 75%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#B48CF0; --primary-hover:#C6A6F5; --primary-soft:#8752D4; --on-primary:#1A1225;
  --tint:#2A2140; --tint-strong:#352A52;
  --bg:#16111F; --surface:#211A2D; --border:#3A3150;
  --text:#EEE8F7; --muted:#A79FB8;
  --zari:#D4B062; --zari-tint:#3A3020;
  --success:#5FBF95; --success-tint:#1D3329; --danger:#E57368; --danger-tint:#3D2220;
  --bench:#0F0B16; --frame:#000000;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
  --grad:linear-gradient(160deg,#8752D4 0%,#4E2690 75%);
  color-scheme:dark}
:root[data-pair="b"]{--f-display:"Cormorant Garamond",Georgia,serif}
:root[data-pair="c"]{--f-display:"Eczar",Georgia,serif}

*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bench);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary-soft);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- bench chrome ---------- */
.bench{max-width:1560px;margin:0 auto;display:grid;gap:16px}
.bench-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.bench-title{display:flex;align-items:center;gap:12px;min-width:0}
.bench-title img{width:44px;height:auto}
.bench-title h1{font-family:var(--f-brand);font-size:24px;font-weight:600;color:var(--primary);line-height:1.1}
.bench-title p{margin:0;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:var(--r-pill);font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px}
.ctl{display:flex;align-items:center;gap:6px}

.bench-body{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:1180px){.bench-body{grid-template-columns:200px minmax(0,1fr)}.notes{grid-column:1/-1}}
.bench-body.wide{grid-template-columns:200px minmax(0,1fr)}.bench-body.wide .notes{grid-column:1/-1}
@media (max-width:760px){.bench-body.wide{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.bench-body{grid-template-columns:minmax(0,1fr)}}
.screens{display:grid;gap:2px;position:sticky;top:12px}
@media (max-width:760px){.screens{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}}
.screens h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-weight:600}
@media (max-width:760px){.screens h2{display:none}}
.screens button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:var(--r-md);cursor:pointer;color:var(--text);font-size:14px;white-space:nowrap}
.screens button:hover{background:var(--tint)}
.screens button[aria-current="true"]{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}
.stage{display:grid;justify-items:center;gap:10px;min-width:0}
.frame{width:min(var(--fw),100%);height:var(--fh);background:var(--frame);border-radius:28px;padding:10px;box-shadow:var(--shadow);transition:width .3s var(--ease)}
.frame[data-device="laptop"]{border-radius:14px}
.frame-cap{font-size:12px;color:var(--muted);letter-spacing:.04em}
.notes{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.notes h3{font-family:var(--f-display);font-size:19px;color:var(--primary);font-weight:600;margin-bottom:4px}
.notes .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--zari);font-weight:600}
.notes ul{padding-left:18px;margin:8px 0 0;display:grid;gap:6px;font-size:14px}
.notes p{font-size:14px;color:var(--muted);margin:8px 0 0}

/* ---------- the app ---------- */
.app{container-type:inline-size;width:100%;height:100%;background:var(--bg);border-radius:20px;overflow:hidden;position:relative;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"head head" "side main" "nav nav"}
.frame[data-device="laptop"] .app{border-radius:8px}
.app.bare{display:block;overflow:auto}
.a-head{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{width:40px;height:auto;flex:none}
.brand .wm{font-family:var(--f-brand);font-size:23px;color:var(--primary);white-space:nowrap;font-weight:600;line-height:1}
.brand .pt{font-family:var(--f-display);font-size:19px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand .back{display:none}
.a-head .right{display:flex;align-items:center;gap:6px;position:relative}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--tint);color:var(--primary);font-family:var(--f-display);font-size:17px;cursor:pointer;display:grid;place-items:center}
.menu{position:absolute;right:0;top:46px;width:230px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);padding:6px;z-index:30;animation:pop .18s var(--ease)}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu .who b{display:block;font-weight:600}
.menu .role{display:inline-block;margin-top:4px;font-size:12px;padding:1px 8px;border-radius:var(--r-pill);background:var(--zari-tint);color:var(--zari);font-weight:600}
.menu .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;font-size:14px}
.menu .seg button{padding:2px 9px;font-size:12px}
.menu .signout{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r-sm);color:var(--danger);cursor:pointer;display:flex;gap:8px;align-items:center}
.menu .signout:hover{background:var(--danger-tint)}

.a-side{grid-area:side;display:none;background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;flex-direction:column;gap:4px;width:84px}
.a-main{grid-area:main;overflow:auto;position:relative;scroll-behavior:smooth}
.a-nav{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--border);padding:4px 4px 8px}
.nv{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:11.5px;cursor:pointer;border-radius:var(--r-md);min-height:48px;position:relative}
.nv svg{width:22px;height:22px}
.nv[aria-current="page"]{color:var(--primary);font-weight:600}
.nv[aria-current="page"]::before{content:"";position:absolute;top:0;width:5px;height:5px;border-radius:50%;background:var(--zari)}
.a-side .nv{font-size:11px;min-height:58px;justify-content:center}
.a-side .nv[aria-current="page"]{background:var(--tint)}
.a-side .nv[aria-current="page"]::before{top:50%;left:2px;transform:translateY(-50%)}
.a-side .spacer{flex:1}

@container (min-width:700px){
  .app{grid-template-rows:auto minmax(0,1fr)}
  .a-side{display:flex}
  .a-nav{display:none}
  .brand .pt{display:none}
}
@container (max-width:699px){ .brand .wm{display:none} }
@container (min-width:1100px){
  .a-side{width:216px;padding:16px 12px}
  .a-side .nv{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;min-height:44px;padding:8px 14px}
  .a-side .nv svg{width:20px;height:20px}
}

.page{padding:16px 16px 24px;display:grid;gap:16px;max-width:1080px;margin:0 auto}
@container (min-width:700px){.page{padding:24px 28px 32px}}
.ph{display:grid;gap:2px}
.ph .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--zari);font-weight:600}
.ph h1{font-family:var(--f-display);font-size:28px;color:var(--text);font-weight:600;line-height:1.15}
.ph .sub{color:var(--muted);font-size:14px}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
@container (max-width:699px){.ph h1{display:none}.ph .eyebrow{display:none}}
.vine{display:block;width:170px;height:auto;max-width:100%;opacity:.55;margin-top:8px}
@container (max-width:699px){.vine{display:none}}

/* kit */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-md);padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;min-height:44px;transition:background .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 14px -6px var(--primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface);color:var(--primary);border-color:var(--primary-soft)}
.btn-secondary:hover{background:var(--tint)}
.btn-ghost{background:none;color:var(--primary)}
.btn-ghost:hover{background:var(--tint)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:var(--r-md);border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--tint);color:var(--primary)}
.icon-btn svg{width:19px;height:19px}

.section{background:var(--surface);border-radius:var(--r-lg);padding:18px;display:grid;gap:14px;scroll-margin-top:60px;border:1px solid var(--border)}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-h h2{font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:8px}
.section-h h2 .n{font-family:var(--f-ui);font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font-weight:600}
.section-h .hint{font-size:13px;color:var(--muted)}
.field{display:grid;gap:5px;min-width:0}
.field label,.lbl{font-weight:600;font-size:14px}
.field .req{color:var(--danger)}
.input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;min-height:44px;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--muted);opacity:.75}
.input:focus{outline:none;border-color:var(--primary-soft);box-shadow:0 0 0 3px var(--tint-strong)}
textarea.input{min-height:88px;resize:vertical}
.help{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.err-msg{font-size:13px;color:var(--danger);display:flex;gap:6px;align-items:center}
.has-err .input{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-tint)}
.has-err .chips{outline:2px solid var(--danger-tint);outline-offset:4px;border-radius:var(--r-md)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--primary-soft)}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--primary);color:var(--primary);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
.grid2{display:grid;gap:14px}
@container (min-width:1100px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
.money{position:relative}
.money .input{padding-left:28px;font-variant-numeric:tabular-nums}
.money::before{content:"₹";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.margin{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-md);background:var(--success-tint);color:var(--success);font-weight:600;font-variant-numeric:tabular-nums}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--zari);font-weight:500;margin-left:6px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ph-tile{aspect-ratio:3/4;border-radius:var(--r-md);position:relative;overflow:hidden;border:0;padding:0;cursor:pointer;max-width:100%}
.ph-tile .cover{position:absolute;left:6px;top:6px;background:var(--zari);color:#fff;font-size:10.5px;letter-spacing:.1em;padding:1px 7px;border-radius:var(--r-pill);font-weight:700}
.ph-tile .x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgb(20 14 30 / .55);color:#fff;display:grid;place-items:center;font-size:14px}
.ph-tile .alt{position:absolute;inset:auto 0 0;padding:14px 6px 5px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgb(20 14 30 / .6));text-align:left}
.ph-add{aspect-ratio:3/4;border:1.5px dashed var(--primary-soft);border-radius:var(--r-md);background:var(--tint);color:var(--primary);display:grid;place-content:center;justify-items:center;gap:4px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;padding:6px}
.ph-add svg{width:26px;height:26px}
.drop{border:1.5px dashed var(--primary-soft);border-radius:var(--r-lg);background:var(--tint);padding:22px;display:grid;justify-items:center;gap:6px;text-align:center;color:var(--primary)}
.drop svg{width:32px;height:32px}
.drop small{color:var(--muted)}
/* fabric swatches drawn with gradients: lavender georgette, maroon zari border, navy */
.fab-1{background:repeating-linear-gradient(115deg,#C9B3EC 0 10px,#BFA5E8 10px 20px)}
.fab-2{background:linear-gradient(#7A1E2C 78%,#C9A24A 78% 84%,#7A1E2C 84%)}
.fab-3{background:radial-gradient(circle at 30% 30%,#2B3F8F 0 2px,transparent 3px) 0 0/14px 14px,#1C2A66}

.secnav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;margin:0;border-bottom:1px solid var(--border)}
@container (min-width:1100px){.secnav{display:none}}
.secnav a{white-space:nowrap;text-decoration:none;font-size:13px;padding:5px 12px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);color:var(--muted);display:flex;gap:6px;align-items:center}
.secnav a.done{color:var(--success);border-color:var(--success-tint)}
.secnav a.bad{color:var(--danger);border-color:var(--danger)}

.vgrid-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.vgrid{border-collapse:separate;border-spacing:6px;font-variant-numeric:tabular-nums}
.vgrid th{font-weight:600;font-size:13px;color:var(--muted);text-align:center;padding:0}
.vgrid th.rowh{text-align:left;color:var(--text);font-size:14px;min-width:44px}
.sw{display:inline-flex;flex-direction:column;align-items:center;gap:3px;min-width:64px}
.sw i{width:18px;height:18px;border-radius:50%;border:1px solid var(--border)}
.vgrid input{width:64px;height:40px;text-align:center;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);font-variant-numeric:tabular-nums}
.vgrid input:focus{outline:none;border-color:var(--primary-soft);box-shadow:0 0 0 3px var(--tint-strong)}
.vgrid input.zero{color:var(--muted)}
.fill{border:0;background:none;color:var(--primary);font-size:11.5px;cursor:pointer;padding:2px 4px;border-radius:var(--r-sm);font-weight:600}
.fill:hover{background:var(--tint)}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between}
.total{font-weight:600}
.total b{color:var(--primary);font-size:18px}
.fillall{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.fillall input{width:58px;min-height:36px;padding:4px 8px}
details.over summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:14px;list-style:none;display:flex;gap:6px;align-items:center}
details.over summary::-webkit-details-marker{display:none}
details.over[open] summary .chev{transform:rotate(90deg)}
.chev{transition:transform .2s}

.actionbar{position:sticky;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.actionbar .why{margin-right:auto;font-size:12.5px;color:var(--muted);max-width:260px;line-height:1.35}
@container (max-width:699px){.actionbar .why{display:none}.actionbar .btn{flex:1}}

.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-lg);background:var(--danger-tint);color:var(--text);border:1px solid var(--danger)}
.banner svg{flex:none;color:var(--danger);width:22px;height:22px;margin-top:2px}
.banner b{display:block;margin-bottom:4px}
.banner a{color:var(--danger);font-weight:600;margin-right:12px}

/* lists */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab .ct{font-size:12px;background:var(--tint);color:var(--primary);border-radius:var(--r-pill);padding:0 7px;font-weight:600}
.tab[aria-selected="true"]{color:var(--primary);border-color:var(--primary);font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:160px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search .input{padding-left:38px}
.lrows{display:grid;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
@container (min-width:1100px){.lrows{grid-template-columns:1fr 1fr}.lrow:nth-child(odd){border-right:1px solid var(--border)}}
.lrow{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 16px;min-height:54px;border-bottom:1px solid var(--border);animation:rise .3s var(--ease) both}
.lrow .nm{flex:1;min-width:0;font-weight:500}
.lrow .hex{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.lrow .sw-dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);flex:none}
.lrow .acts{display:flex;gap:2px}
.lrow.editing{background:var(--tint)}
.lrow.editing .input{min-height:38px;padding:6px 10px}
.count-line{font-size:13px;color:var(--muted)}

/* empty state */
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:40px 24px;display:grid;justify-items:center;text-align:center;gap:10px;position:relative;overflow:hidden}
.empty .mark{width:112px;height:auto;opacity:.85}
.empty h2{font-family:var(--f-accent);font-size:22px;font-weight:600;color:var(--text)}
.empty p{color:var(--muted);max-width:42ch;margin:0}
.empty .soon{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--zari);font-weight:600}
.empty::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:1px solid var(--primary-soft);opacity:.12;box-shadow:0 0 0 22px transparent,0 0 0 23px var(--primary-soft)}

/* login */
.login{min-height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
.login-hero{background:var(--hero);display:grid;justify-items:center;align-content:center;text-align:center;padding:36px 20px 70px;position:relative;overflow:hidden}
.login-hero .logo{width:min(300px,82%);height:auto;position:relative;z-index:1}
.login-hero::before,.login-hero::after{content:"";position:absolute;border-radius:50%;border:1px solid #6D37C0;opacity:.12}
.login-hero::before{width:340px;height:340px;left:-120px;bottom:-200px}
.login-hero::after{width:260px;height:260px;right:-90px;top:-120px}
.login-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;width:min(380px,calc(100% - 32px));margin:-40px auto 24px;display:grid;gap:14px;align-self:start;position:relative;z-index:2}
.login-card h2{font-family:var(--f-accent);font-size:21px;font-weight:600;text-align:center}
.login-card .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.login-card .or::before,.login-card .or::after{content:"";flex:1;height:1px;background:var(--border)}
.btn-google{background:var(--surface);border:1px solid var(--border);color:var(--text);width:100%}
.btn-google:hover{background:var(--tint)}
.devbox{border:1px dashed var(--zari);border-radius:var(--r-md);padding:10px;display:grid;gap:6px;background:var(--zari-tint)}
.devbox small{color:var(--zari);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.devbox .btn{background:transparent;color:var(--text);border:1px solid var(--zari);min-height:38px}
@container (min-width:1100px){
  .login{grid-template-columns:1.1fr 1fr;grid-template-rows:1fr}
  .login-hero{padding:40px;min-height:100%}
  .login-hero .logo{width:min(420px,80%)}
  .login-card{margin:auto;align-self:center}
}
.skip{position:absolute;right:12px;top:12px;z-index:3;border:1px solid #6D37C0;background:rgb(255 255 255 / .55);color:#5A2BA3;border-radius:var(--r-pill);padding:4px 12px;font-size:12.5px;cursor:pointer}

/* intro animation: the real logo blooms in (scale + soft blur), rings ripple, then the card rises */
.intro .logo{animation:bloomlogo 1s var(--ease) both}
.intro .login-hero::before,.intro .login-hero::after{animation:ripple 1.4s var(--ease) both}
.intro .login-hero::after{animation-delay:.15s}
.intro .login-card{animation:rise .6s var(--ease) both;animation-delay:.7s}
@keyframes bloomlogo{0%{transform:scale(.86);opacity:0;filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:none;opacity:1;filter:none}}
@keyframes ripple{from{transform:scale(.6);opacity:0}to{transform:none;opacity:.12}}
.stagger > *{animation:rise .45s var(--ease) both}
.stagger > *:nth-child(2){animation-delay:.04s}.stagger > *:nth-child(3){animation-delay:.08s}.stagger > *:nth-child(4){animation-delay:.12s}.stagger > *:nth-child(5){animation-delay:.16s}.stagger > *:nth-child(6){animation-delay:.2s}.stagger > *:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(-4px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* dialog + toast inside the app */
.scrim{position:absolute;inset:0;background:rgb(20 14 30 / .45);display:grid;place-items:center;padding:16px;z-index:40;animation:fade .18s}
.dialog{background:var(--surface);border-radius:var(--r-lg);padding:22px;width:min(400px,100%);display:grid;gap:12px;box-shadow:var(--shadow);animation:pop .22s var(--ease)}
.dialog h2{font-family:var(--f-display);font-size:21px;font-weight:600}
.dialog p{margin:0;color:var(--muted)}
.dialog .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
@container (max-width:699px){.scrim{align-items:end;padding:0}.dialog{width:100%;border-radius:var(--r-lg) var(--r-lg) 0 0}.dialog .acts .btn{flex:1}}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-md);font-size:14px;display:flex;gap:10px;align-items:center;z-index:50;animation:rise .25s var(--ease);box-shadow:var(--shadow);white-space:nowrap}
@container (min-width:700px){.toast{bottom:24px}}
.toast .ok{color:var(--success)}
.toast button{border:0;background:none;color:var(--primary-soft);font-weight:700;cursor:pointer}

/* kit page */
.kit{display:grid;gap:18px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.swatch{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.swatch i{display:block;height:54px}
.swatch div{padding:6px 10px;font-size:12.5px}
.swatch b{display:block;font-size:13px}
.type-row{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--border)}
.type-row:last-child{border-bottom:0}
.type-row small{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.motifs{display:flex;flex-wrap:wrap;gap:24px;align-items:center;color:var(--primary)}
.loader{display:flex;gap:6px}
.loader i{width:8px;height:8px;border-radius:50%;background:var(--primary-soft);animation:pulse 1.2s infinite}
.loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 10px;border-radius:var(--r-pill);font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-active{background:var(--success-tint);color:var(--success)}
.b-draft{background:var(--tint);color:var(--primary)}
.b-attn{background:var(--zari-tint);color:var(--zari)}
.b-sold{background:var(--danger-tint);color:var(--danger)}
.row-wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

const NAV=[["inventory","Inventory",I.inv,"inventory"],["add","Add Item",I.add,"add-empty"],["sales","Sales",I.sales,"sales"],["dashboard","Dashboard",I.dash,"dashboard"],["lists","Lists",I.lists,"lists"]];
function navBtns(cur,side){return NAV.map(([k,l,i,t])=>`<button class="nv" data-go="${t}" ${cur===k?'aria-current="page"':''}>${i}<span>${side&&k==="lists"?"Manage Lists":l}</span></button>`).join("")}
const TITLES={inventory:"Inventory","add-empty":"Add Item","add-filled":"Add Item","add-errors":"Add Item",lists:"Manage Lists",confirm:"Manage Lists",sales:"Sales",dashboard:"Dashboard",menu:"Inventory"};

function shell(body,screen){
  const sc=SCREENS.find(s=>s.id===screen);
  return `<header class="a-head">
    <div class="brand"><img src="${MARK}" alt="" width="40" height="22"><span class="wm">Madhurya Vastra</span><span class="pt">${TITLES[screen]||""}</span></div>
    <div class="right"><button class="avatar" id="avatar" aria-haspopup="menu" aria-expanded="${S.menu}" aria-label="Account menu">K</button>${S.menu?menuHtml():""}</div>
  </header>
  <nav class="a-side" aria-label="Main">${navBtns(sc.nav,true)}<div class="spacer"></div></nav>
  <main class="a-main" id="amain">${body}</main>
  <nav class="a-nav" aria-label="Main">${navBtns(sc.nav,false)}</nav>
  ${S.dialog?dialogHtml():""}${S.toast?`<div class="toast" role="status"><span class="ok">${I.check.replace('<svg','<svg style="width:16px;height:16px"')}</span>${S.toast}<button id="undo">Undo</button></div>`:""}`;
}
function menuHtml(){
  const t=document.documentElement.dataset.theme||"system";
  return `<div class="menu" role="menu" id="menu">
   <div class="who"><b>Krishna Sindha</b><span class="role">Owner</span></div>
   <div class="row"><span>Theme</span><div class="seg" role="group" aria-label="Theme">${["system","light","dark"].map(v=>`<button data-theme-set="${v}" aria-pressed="${t===v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div></div>
   <button class="signout" role="menuitem">${I.out.replace('<svg','<svg style="width:17px;height:17px"')}Sign out</button></div>`;
}
function pageHead(eyebrow,title,sub,action=""){
  return `<div class="ph-row"><div class="ph"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1>${sub?`<span class="sub">${sub}</span>`:""}${vine()}</div>${action}</div>`;
}
function emptyState(title,text,cta,soon){
  return `<section class="empty">${mark()}${soon?`<span class="soon">${soon}</span>`:""}<h2>${title}</h2><p>${text}</p>${cta||""}</section>`;
}

function inventory(){

function placeholder(kind){

function addItem(){
  const f=S.form, E=f.errors;
  const errs=E?["title","wear","sell"]:[];
  const has=k=>errs.includes(k)?"has-err":"";
  const secDone={photos:f.photos>0,details:!!f.title&&!!f.wear,classify:f.occ.length+f.tags.length>0,price:!!f.sell,variants:f.sizes.length&&f.colors.length};
  const secBad={details:E,price:E};
  const secs=[["photos","Photos"],["details","Details"],["classify","Classify"],["price","Price"],["variants","Variants"]];
  const margin=(f.cost&&f.sell&&+f.sell>0)?{amt:f.sell-f.cost,pct:((f.sell-f.cost)/f.sell*100)}:null;
  const total=Object.values(f.qty).reduce((a,b)=>a+(+b||0),0);
  const photoTiles=f.photos?[1,2,3].slice(0,f.photos).map((n,i)=>`<button class="ph-tile fab-${n}" aria-label="Preview photo ${n}">${i===0?'<span class="cover">COVER</span>':""}<span class="x" aria-hidden="true">×</span><span class="alt">${["Front drape","Zari border","Pallu detail"][i]}</span></button>`).join("")+`<button class="ph-add">${I.cam}Add photo<small style="font-weight:400;color:var(--muted)">${f.photos}/8</small></button>`:"";
  return `
  ${''}<div class="secnav" role="navigation" aria-label="Form sections">${secs.map(([k,l],i)=>`<a href="#s-${k}" class="${secBad[k]?"bad":secDone[k]?"done":""}">${secBad[k]?"!":secDone[k]?"✓":i+1} ${l}</a>`).join("")}</div>
  <div class="page stagger">
   ${pageHead("New stock","Add Item","Fill what you know now; you can save as a draft and finish later.")}
   ${E?`<div class="banner" role="alert">${I.alert}<div><b>3 things need fixing before this item can be added</b><a href="#s-details">Title</a><a href="#s-details">Wear type</a><a href="#s-price">Selling price</a></div></div>`:""}
   <div class="grid2">
    <div style="display:grid;gap:16px">
     <section class="section" id="s-photos"><div class="section-h"><h2><span class="n">1</span>Photos</h2><span class="hint">First photo is the cover</span></div>
      ${f.photos?`<div class="photos">${photoTiles}</div>`:`<div class="drop">${I.cam}<b>Add photos</b><small>Up to 8 · JPEG, PNG or WebP · 5 MB each</small></div>`}
     </section>
     <section class="section" id="s-details"><div class="section-h"><h2><span class="n">2</span>Details</h2></div>
      <div class="field ${has("title")}"><label for="f-title">Title <span class="req">*</span></label><input id="f-title" class="input" maxlength="150" placeholder="e.g. Lavender Georgette Saree" value="${esc(f.title)}">
        <span class="help">${has("title")?`<span class="err-msg">Add a title so staff can find this item</span>`:"<span></span>"}<span>${f.title.length}/150</span></span></div>
      <div class="field"><label for="f-desc">Description</label><textarea id="f-desc" class="input" maxlength="500" placeholder="Fabric, work, special features…">${esc(f.desc)}</textarea><span class="help"><span></span><span>${f.desc.length}/500</span></span></div>
      <div class="field"><label for="f-type">Item type</label><select id="f-type" class="input select"><option value="">Choose a type</option>${DATA.types.map(t=>`<option ${t===f.type?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="field ${has("wear")}"><span class="lbl">Wear type <span class="req">*</span></span><div class="chips" role="group" aria-label="Wear type">${[["top","Top wear"],["bottom","Bottom wear"],["both","Top + Bottom"]].map(([v,l])=>`<button type="button" class="chip" data-wear="${v}" aria-pressed="${f.wear===v}">${l}</button>`).join("")}</div>${has("wear")?`<span class="err-msg">Choose top, bottom or both</span>`:""}</div>
     </section>
    </div>
    <div style="display:grid;gap:16px">
     <section class="section" id="s-classify"><div class="section-h"><h2><span class="n">3</span>Classify</h2><span class="hint">Helps customers filter later</span></div>
      <div class="field"><span class="lbl">Occasions</span><div class="chips">${DATA.occasions.map(o=>`<button type="button" class="chip" data-occ="${o}" aria-pressed="${f.occ.includes(o)}">${o}</button>`).join("")}</div></div>

     <div class="row-wrap"><button class="btn btn-secondary btn-sm" id="add-size">${I.plus}Size</button><button class="btn btn-secondary btn-sm" id="add-color">${I.plus}Colour</button></div></div>

  </div>

}

  <details class="over"><summary>${I.chev}Different price for some variants? <span style="color:var(--muted);font-weight:400">(optional)</span></summary>
   <div class="vgrid-wrap" style="margin-top:8px"><table class="vgrid"><thead><tr><th></th>${f.colors.map(c=>`<th><span class="sw"><i style="background:${sw(c)}"></i>${c}</span></th>`).join("")}</tr></thead>
   <tbody>${f.sizes.map(s=>`<tr><th class="rowh">${s}</th>${f.colors.map(c=>`<td><input style="width:76px" aria-label="${s} ${c} price" value="${f.over[s+"|"+c]||""}" placeholder="${f.sell||"–"}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>

function lists(){

  const raw=S.tab==="colors"?DATA.colors:DATA[S.tab].map(n=>[n]);
  const rows=raw.filter(r=>r[0].toLowerCase().includes(S.q.toLowerCase()));
  const label=tabs.find(t=>t[0]===S.tab)[1].toLowerCase();
  return `<div class="page stagger">
   ${pageHead("Shop settings","Manage Lists","The choices staff pick from when adding an item.",`<button class="btn btn-primary" id="addnew">${I.plus}Add ${label.replace(/s$/,"")}</button>`)}
   <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}<span class="ct">${(k==="colors"?DATA.colors:DATA[k]).length}</span></button>`).join("")}</div>
   <div class="toolbar"><div class="search">${I.search}<input id="lq" class="input" placeholder="Search ${label}" value="${esc(S.q)}" aria-label="Search ${label}"></div></div>
   ${rows.length?`<div class="lrows">${rows.map(r=>S.editing===r[0]?`<div class="lrow editing">${r[1]?`<span class="sw-dot" style="background:${r[1]}"></span>`:""}<input class="input" value="${esc(r[0])}" aria-label="Name" style="flex:1">${r[1]?`<input class="input" value="${r[1]}" aria-label="Hex code" style="width:96px">`:""}<button class="icon-btn" data-save aria-label="Save">${I.check}</button><button class="icon-btn" data-cancel aria-label="Cancel">${I.x}</button></div>`:`<div class="lrow">${r[1]?`<span class="sw-dot" style="background:${r[1]}"></span>`:""}<span class="nm">${r[0]}</span>${r[1]?`<span class="hex">${r[1]}</span>`:""}<span class="acts"><button class="icon-btn" data-edit="${r[0]}" aria-label="Edit ${r[0]}">${I.edit}</button><button class="icon-btn" data-del="${r[0]}" aria-label="Delete ${r[0]}">${I.del}</button></span></div>`).join("")}</div>

/* ---------- render ---------- */
const DEV={phone:{w:390,h:800,cap:"Phone · 390 × 844"},tablet:{w:768,h:900,cap:"Tablet · 768 × 1024"},laptop:{w:1280,h:760,cap:"Laptop · 1366 × 768"}};
function render(opts={}){
  const s=S.screen;
  let body;
  app.classList.toggle("bare",s==="login");
  if(s==="login"){app.innerHTML=login();bindLogin();}
  else{
    if(s==="inventory"||s==="menu") body=inventory();
    else if(s.startsWith("add")) body=addItem();
    else if(s==="lists"||s==="confirm") body=lists();
    else if(s==="sales"||s==="dashboard") body=placeholder(s);
    else if(s==="kit") body=kit();
    app.innerHTML=shell(body,s==="kit"?"inventory":s);
    if(s==="kit") app.querySelectorAll('.nv[aria-current]').forEach(n=>n.removeAttribute("aria-current"));
  }
  if(opts.keepScroll!=null){const m=$("#amain");if(m)m.scrollTop=opts.keepScroll;}
  if(!opts.anim) app.querySelectorAll(".stagger").forEach(e=>e.classList.remove("stagger"));
  // chrome
  document.querySelectorAll("#screens button").forEach(b=>b.setAttribute("aria-current",b.dataset.s===s));
  frame.style.setProperty("--fw",DEV[S.device].w+"px");frame.style.setProperty("--fh",DEV[S.device].h+"px");frame.dataset.device=S.device;$("#bbody").classList.toggle("wide",S.device==="laptop");
  $("#cap").textContent=DEV[S.device].cap+(S.device!=="phone"?" (narrows to fit your window)":"");
  document.querySelectorAll("#seg-device button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.device===S.device));
  const sc=SCREENS.find(x=>x.id===s);
  $("#notes").innerHTML=`<span class="eyebrow">${sc.group}</span><h3>${sc.name}</h3><p>${sc.notes.why}</p><ul>${sc.notes.list.map(l=>`<li>${l}</li>`).join("")}</ul>`;
}
function go(id){
  S.screen=id;S.menu=id==="menu";S.dialog=id==="confirm"?"Crepe":null;S.toast=null;S.editing=null;S.q="";
  if(id==="confirm") S.tab="tags";
  if(id==="lists") S.tab="types";
  if(id.startsWith("add")) S.form=freshForm(id.slice(4));
  try{history.replaceState(null,"","#"+id)}catch(e){}
  store.set("mv-screen",id);
  render({anim:true});
}
function bindLogin(){
  const sk=$("#skip");
  sk&&sk.addEventListener("click",()=>{$("#login").classList.remove("intro")});
}

/* ---------- events (delegated) ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");
  if(S.menu&&!e.target.closest("#menu")&&!e.target.closest("#avatar")){S.menu=false;render({keepScroll:$("#amain")?.scrollTop});}
  if(!t) return;
  const d=t.dataset;
  if(d.s){go(d.s);return}
  if(d.device){S.device=d.device;store.set("mv-device",S.device);render();return}
  if(d.pair){document.documentElement.dataset.pair=d.pair;store.set("mv-pair",d.pair);syncSegs();if(S.screen==="kit")render();return}
  if(d.themeSet){setTheme(d.themeSet);return}
  if(d.go){go(d.go);return}
  if(t.id==="avatar"){S.menu=!S.menu;render({keepScroll:$("#amain")?.scrollTop});return}
  const sc=$("#amain")?.scrollTop;
  const f=S.form;
  if(d.wear!==undefined&&f){f.wear=d.wear;f.errors=false;render({keepScroll:sc});return}
  if(d.occ&&f){toggle(f.occ,d.occ);render({keepScroll:sc});return}
  if(d.tag&&f){toggle(f.tags,d.tag);render({keepScroll:sc});return}
  if(d.fillrow&&f){const v=prompt0();f.colors.forEach(c=>f.qty[d.fillrow+"|"+c]=v);render({keepScroll:sc});return}
  if(d.fillcol&&f){const v=prompt0();f.sizes.forEach(s=>f.qty[s+"|"+d.fillcol]=v);render({keepScroll:sc});return}
  if(t.id==="fillall-go"&&f){const v=parseInt($("#fillall").value,10);if(v>=0){f.sizes.forEach(s=>f.colors.forEach(c=>f.qty[s+"|"+c]=v));render({keepScroll:sc})}return}
  if(t.id==="add-size"&&f){const order=["XS","S","M","L","XL","XXL","Free size"];const n=order.find(x=>!f.sizes.includes(x));if(n){f.sizes.push(n);if(!f.colors.length)f.colors.push("Lavender")}render({keepScroll:sc});return}
  if(t.id==="add-color"&&f){const n=DATA.colors.map(c=>c[0]).find(x=>!f.colors.includes(x));if(n){f.colors.push(n);if(!f.sizes.length)f.sizes.push("Free size")}render({keepScroll:sc});return}
  if(d.act==="submit"&&f){if(!f.title||!f.wear||!f.sell){f.errors=true;render();$("#amain").scrollTop=0}else{S.toast="Added “"+f.title+"” to inventory";render({keepScroll:sc});later()}return}
  if(d.act==="draft"&&f){S.toast="Saved as draft";render({keepScroll:sc});later();return}
  if(d.tab){S.tab=d.tab;S.q="";S.editing=null;render({anim:true});return}
  if(d.edit){S.editing=d.edit;render({keepScroll:sc});return}
  if(d.save!==undefined||d.cancel!==undefined){S.editing=null;if(d.save!==undefined){S.toast="Saved";later()}render({keepScroll:sc});return}
  if(d.del){S.dialog=d.del;render({keepScroll:sc});return}
  if(t.id==="dlg-no"){S.dialog=null;render({keepScroll:sc});return}
  if(t.id==="dlg-yes"){S.toast="Deleted “"+S.dialog+"”";S.dialog=null;render({keepScroll:sc});later();return}
  if(t.id==="undo"){S.toast=null;render({keepScroll:sc});return}
  if(t.id==="clearq"){S.q="";render();return}
  if(t.id==="addnew"){S.toast="New row opens inline at the top";render({keepScroll:sc});later();return}
  if(t.matches(".secnav a")){e.preventDefault();const el=app.querySelector(t.getAttribute("href"));el&&$("#amain").scrollTo({top:el.offsetTop-56,behavior:"smooth"});return}
  if(t.matches(".banner a")){e.preventDefault();const el=app.querySelector(t.getAttribute("href"));el&&$("#amain").scrollTo({top:el.offsetTop-56,behavior:"smooth"});return}
});
function prompt0(){const v=parseInt(($("#fillall")||{}).value,10);return v>=0?v:1}
function toggle(a,v){const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)}
let tmr;function later(){clearTimeout(tmr);tmr=setTimeout(()=>{S.toast=null;const m=$("#amain");render({keepScroll:m?m.scrollTop:0})},2600)}
document.addEventListener("input",e=>{
  const t=e.target,f=S.form;
  if(t.id==="lq"){S.q=t.value;const pos=t.selectionStart;render({keepScroll:$("#amain").scrollTop});const n=$("#lq");n.focus();n.setSelectionRange(pos,pos);return}
  if(!f) return;
  if(t.dataset.q){f.qty[t.dataset.q]=parseInt(t.value,10)||0;const tot=Object.values(f.qty).reduce((a,b)=>a+(+b||0),0);const b=app.querySelector(".total b");if(b)b.textContent=tot;return}
  const map={"f-title":"title","f-desc":"desc","f-cost":"cost","f-sell":"sell"};
  if(map[t.id]){f[map[t.id]]=t.value;
    if(t.id==="f-title"||t.id==="f-desc"){const c=t.closest(".field").querySelector(".help span:last-child");if(c)c.textContent=t.value.length+"/"+(t.id==="f-title"?150:500);
      if(t.id==="f-title"&&t.value){const fe=t.closest(".field");fe.classList.remove("has-err");const m=fe.querySelector(".err-msg");m&&m.remove()}}
    if(t.id==="f-cost"||t.id==="f-sell"){const pos=t.selectionStart;render({keepScroll:$("#amain").scrollTop});const n=$("#"+t.id);n.focus();n.setSelectionRange(pos,pos)}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="f-type"&&S.form)S.form.type=e.target.value});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(S.menu){S.menu=false;render({keepScroll:$("#amain")?.scrollTop});$("#avatar")?.focus()}else if(S.dialog){S.dialog=null;render()}else if(S.editing){S.editing=null;render()}}
});

/* ---------- theme ---------- */
function setTheme(v){
  if(v==="system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=v;
  store.set("mv-theme",v);syncSegs();
  if(S.menu) render({keepScroll:$("#amain")?.scrollTop});
}
function syncSegs(){
  const th=document.documentElement.dataset.theme||"system";
  document.querySelectorAll("#seg-theme button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===th));
  const p=document.documentElement.dataset.pair||"a";
  document.querySelectorAll("#seg-pair button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pair===p));
}

/* ---------- boot ---------- */
$("#screens").innerHTML=["Entry","Staff app","Foundation"].map(g=>`<h2>${g}</h2>`+SCREENS.filter(s=>s.group===g).map(s=>`<button data-s="${s.id}">${s.name}</button>`).join("")).join("");
const savedTheme=store.get("mv-theme");if(savedTheme&&savedTheme!=="system")document.documentElement.dataset.theme=savedTheme;
document.documentElement.dataset.pair=store.get("mv-pair")||"a";
const dv=store.get("mv-device");if(dv&&DEV[dv])S.device=dv;else if(window.innerWidth>=1200)S.device="phone";
syncSegs();
const h=(location.hash||"").slice(1);
const start=SCREENS.some(s=>s.id===h)?h:(store.get("mv-screen")&&SCREENS.some(s=>s.id===store.get("mv-screen"))?store.get("mv-screen"):"login");
go(start);
})();
</script>
