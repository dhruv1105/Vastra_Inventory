# Base stack: Postgres + the app (production image).
# Development: ./scripts/dev-up.sh (adds docker-compose.dev.yml — live reload, DB port, seeds).
# Values come from .env (copy .env.example).

name: vastra

services:
  db:
    image: postgres:16-alpine
    container_name: vastra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ./madhurya-vastra
      target: runner
    container_name: vastra-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Required in production: the app refuses to start without it.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Item photos. Temporary: production will use object storage (S3); see docs/roadmap.md.
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
